services:
  web-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - AI_ENGINE_URL=http://ai-engine:8000
      - CLOUD_PROVIDER=local
      - STORAGE_PROVIDER=local
    depends_on:
      - ai-engine

  ai-engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - mk_ai_datasets:/data/datasets
      - mk_ai_models:/data/models

volumes:
  mk_ai_datasets:
  mk_ai_models:

services:
  web-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - AI_ENGINE_URL=http://ai-engine:8000
      - CLOUD_PROVIDER=local
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - LOCAL_STORAGE_DIR=/data/local_storage
      - S3_BUCKET=${S3_BUCKET:-}
      - S3_REGION=${S3_REGION:-}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-}
      - CLOUD_REGION=${CLOUD_REGION:-}
      - GCS_BUCKET=${GCS_BUCKET:-}
    volumes:
      - mk_ai_local_storage:/data/local_storage
    depends_on:
      - ai-engine

  ai-engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - mk_ai_datasets:/data/datasets
      - mk_ai_models:/data/models

  # Optional local S3-compatible object store for testing STORAGE_PROVIDER=s3
  # Launch with: docker compose --profile minio up -d
  minio:
    image: minio/minio:latest
    profiles:
      - minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - mk_ai_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mk_ai_local_storage:
  mk_ai_datasets:
  mk_ai_models:
  mk_ai_minio:
